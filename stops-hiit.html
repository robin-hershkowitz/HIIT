<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stops HIIT</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e0f;
    --surface: #1a1a1c;
    --surface2: #242426;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0ede8;
    --muted: #7a7875;
    --work: #d0d6e0;
    --work-dim: rgba(208,214,224,0.12);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2rem 1rem 4rem;
  }

  .container { width: 100%; max-width: 480px; }

  .header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 2rem; }
  .title { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.6rem; letter-spacing: -0.02em; }
  .title span { color: var(--work); }

  .sound-toggle { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); cursor: pointer; user-select: none; }
  .sound-toggle input { display: none; }
  .toggle-pill { width: 32px; height: 18px; background: var(--surface2); border-radius: 9px; position: relative; border: 1px solid var(--border2); transition: background 0.2s; }
  .toggle-pill::after { content: ''; position: absolute; left: 3px; top: 3px; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); transition: left 0.2s, background 0.2s; }
  .sound-toggle input:checked + .toggle-pill { background: var(--work-dim); border-color: var(--work); }
  .sound-toggle input:checked + .toggle-pill::after { left: 17px; background: var(--work); }

  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 1.25rem; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem; text-align: center; }
  .stat-label { font-size: 10px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
  .stat-val { font-size: 20px; font-weight: 500; }

  .circuit-dots { display: flex; gap: 6px; margin-bottom: 1.25rem; align-items: center; }
  .circuit-dots .label { font-size: 11px; color: var(--muted); margin-right: 4px; letter-spacing: 0.06em; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--border2); transition: all 0.3s; }
  .dot.active { background: var(--work); border-color: var(--work); box-shadow: 0 0 8px rgba(208,214,224,0.5); }
  .dot.done { background: var(--muted); border-color: var(--muted); }

  .main-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; margin-bottom: 1rem; position: relative; overflow: hidden; }
  .main-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--phase-color, var(--work)); transition: background 0.4s; }

  .phase-pill { display: inline-block; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 10px; border-radius: 20px; margin-bottom: 0.75rem; border: 1px solid; transition: all 0.3s; }
  .ex-name { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.5rem; letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 0.5rem; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1rem; }
  .tag { font-size: 10px; padding: 3px 9px; border-radius: 20px; letter-spacing: 0.04em; border: 1px solid var(--border2); color: var(--muted); background: var(--surface2); }

  .progress-wrap { height: 4px; background: var(--surface2); border-radius: 2px; margin-bottom: 0.4rem; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 2px; background: var(--phase-color, var(--work)); transition: width 0.5s linear, background 0.4s; }

  .countdown-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1rem; }
  .countdown { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 3rem; line-height: 1; transition: color 0.3s; }
  .next-label { font-size: 11px; color: var(--muted); text-align: right; max-width: 180px; line-height: 1.4; }

  .phase-sub { font-size: 11px; color: var(--muted); text-align: right; margin-bottom: 0.75rem; }
  .tip { font-size: 12px; color: var(--muted); line-height: 1.6; border-left: 2px solid var(--border2); padding-left: 10px; }
  .why { font-size: 11px; color: var(--muted); line-height: 1.6; margin-top: 0.75rem; opacity: 0.85; }
  .why b { color: var(--work); font-weight: 500; }

  .controls { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; margin-bottom: 1.5rem; }
  button { font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; padding: 0.85rem 1rem; border-radius: 10px; border: 1px solid var(--border2); background: var(--surface); color: var(--text); cursor: pointer; letter-spacing: 0.04em; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 8px; }
  button:hover { background: var(--surface2); border-color: rgba(255,255,255,0.2); }
  button:active { transform: scale(0.97); }
  #btn-start { background: var(--work-dim); border-color: var(--work); color: var(--work); }
  #btn-start:hover { background: rgba(208,214,224,0.2); }

  .legend { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 1.5rem; }
  .legend-item { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 0.75rem; font-size: 11px; }
  .legend-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 5px; vertical-align: middle; }

  details { margin-top: 0.5rem; }
  summary { font-size: 12px; color: var(--muted); cursor: pointer; letter-spacing: 0.04em; padding: 0.5rem 0; list-style: none; display: flex; align-items: center; gap: 6px; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: '▸'; font-size: 10px; transition: transform 0.2s; }
  details[open] summary::before { transform: rotate(90deg); }

  .list-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12px; flex-wrap: wrap; }
  .list-item:last-child { border-bottom: none; }
  .list-num { color: var(--muted); min-width: 20px; font-size: 11px; }

  .done-screen { text-align: center; padding: 3rem 1rem; }
  .done-screen .trophy { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 4rem; color: var(--work); margin-bottom: 1rem; }
  .done-screen h2 { font-family: 'Syne', sans-serif; font-size: 1.6rem; font-weight: 800; margin-bottom: 0.5rem; }
  .done-screen p { color: var(--muted); font-size: 13px; margin-bottom: 1.5rem; }
  .done-screen button { margin: 0 auto; max-width: 260px; }
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15120f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Derby.Fit">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script src="app.js" defer></script>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title">Stops<span>.</span>hiit</div>
    <label class="sound-toggle">
      <input type="checkbox" id="sound-toggle" checked>
      <span class="toggle-pill"></span>
      <span id="sound-label">sound on</span>
    </label>
  </div>

  <div class="stats-row">
    <div class="stat"><div class="stat-label">Circuit</div><div class="stat-val" id="stat-circuit">1/3</div></div>
    <div class="stat"><div class="stat-label">Exercise</div><div class="stat-val" id="stat-ex">1/10</div></div>
    <div class="stat"><div class="stat-label">Elapsed</div><div class="stat-val" id="stat-time">0:00</div></div>
  </div>

  <div class="circuit-dots">
    <span class="label">CIRCUITS</span>
    <div id="circuit-dots"></div>
  </div>

  <div class="main-card">
    <div class="phase-pill" id="phase-pill">READY</div>
    <div class="ex-name" id="ex-name"></div>
    <div class="tags" id="tags"></div>
    <div class="countdown-row">
      <div class="countdown" id="countdown"></div>
      <div class="next-label" id="next-label"></div>
    </div>
    <div class="progress-wrap"><div class="progress-fill" id="progress-fill" style="width:100%;"></div></div>
    <div class="phase-sub" id="phase-sub"></div>
    <div class="tip" id="tip"></div>
    <div class="why" id="why"></div>
  </div>

  <div class="controls">
    <button id="btn-start" onclick="startPause()">▶ &nbsp;Start</button>
    <button onclick="resetAll()">↺ &nbsp;Reset</button>
  </div>

  <div class="legend" id="legend"></div>

  <details>
    <summary>all exercises</summary>
    <div id="full-list"></div>
  </details>
</div>

<script>
const exercises = [
  { name:"Happy feet to plow freeze", tags:["cardio","coord"],
    tip:"Quick feet in place for 4 counts, then snap into a wide, low plow stance (toes in, heels out) and hold 2 counts. Repeat.",
    why:"Trains reacting into the stop shape fast, the way a whistle stop works." },
  { name:"Plow squat pulses", tags:["hip"],
    tip:"Wide stance, toes turned in. Sit low and pulse while pressing your heels outward into the floor. Knees stay soft, chest up.",
    why:"Builds the hip internal rotation and inner-thigh push that powers a plow." },
  { name:"Towel T-stop drags", tags:["coord","hip"],
    tip:"Stand on your left leg, right foot on a towel behind you at 90°. Slide it with steady pressure while staying low. Switch at 35s for the last 25s.",
    why:"The closest off-skates rehearsal of the stop itself. Left standing leg gets the longer turn." },
  { name:"Sumo squat + bicep curl", tags:["weights","hip"],
    tip:"2 lb weights. Wide squat, toes slightly out. Curl at the bottom, stand and lower the weights. Knees track over toes.",
    why:"Quad and adductor strength for holding a deep, stable plow." },
  { name:"Side plank with top-leg lift", tags:["core","hip"],
    tip:"Forearm side plank, knees down if needed. Lift the top leg slowly and lower with control. Switch sides at 30s.",
    why:"Strengthens the glute med, which keeps your drag leg turned out and your hips from collapsing in a T-stop." },
  { name:"Dragon squats", tags:["hip","coord"],
    tip:"Stand on your left leg, sweep your right leg behind and across, then sink as low as you control. Hold the counter if needed; partial depth is fine. Switch at 30s.",
    why:"Single-leg depth with the free leg behind you, the same shape and load as dropping into a T-stop." },
  { name:"90/90 hip switches", tags:["stretch","hip"],
    tip:"Sit with both knees bent at 90°, one in front and one to the side. Rotate both knees to the other side and back. Hands behind you for support.",
    why:"Opens internal rotation (plow) and external rotation (T-stop drag foot) in one move." },
  { name:"Single-leg deadlift", tags:["weights","hip"],
    tip:"2 lb weight in the opposite hand. Left leg stands first. Hinge forward, back leg reaches long, hips stay square. Switch at 35s.",
    why:"Balance and back-of-leg control on the standing leg." },
  { name:"Plank shoulder taps", tags:["core"],
    tip:"High plank, feet wide. Tap one shoulder, then the other, without letting your hips rock side to side.",
    why:"Anti-rotation, so your torso stays square when the T-stop drag starts." },
  { name:"Frog rock-backs", tags:["stretch","hip"],
    tip:"On all fours, knees wide, ankles in line with knees. Slowly rock hips back toward your heels and return.",
    why:"Adductor and hip mobility for a wider, steadier plow." },
];

const tagColors = {
  cardio:  { bg:"rgba(245,166,35,0.12)",  color:"#f5a623", border:"rgba(245,166,35,0.3)"  },
  core:    { bg:"rgba(90,180,245,0.12)",  color:"#5ab4f5", border:"rgba(90,180,245,0.3)"  },
  coord:   { bg:"rgba(167,139,250,0.12)", color:"#a78bfa", border:"rgba(167,139,250,0.3)" },
  hip:     { bg:"rgba(90,245,180,0.12)",  color:"#5af5b4", border:"rgba(90,245,180,0.3)"  },
  stretch: { bg:"rgba(200,245,90,0.12)",  color:"#c8f55a", border:"rgba(200,245,90,0.3)"  },
  weights: { bg:"rgba(245,90,90,0.12)",   color:"#f55a5a", border:"rgba(245,90,90,0.3)"   },
};
const tagLabel = { cardio:"Cardio", core:"Core", coord:"Coordination", hip:"Hip rotation", stretch:"Stretch", weights:"2 lb weights" };

const phaseColors = { work:"#d0d6e0", rest:"#f5a623", break:"#5ab4f5", idle:"#d0d6e0" };

const WORK=60, REST=20, BREAK=60, CIRCUITS=3;
const N = exercises.length;
let circuit=0, exIdx=0, phase="idle", remaining=WORK, totalElapsed=0;
let timerInt=null, started=false, audioCtx=null;

function getAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }

function beep(freq,dur,vol,delay){
  try {
    const ctx=getAudio(), o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type="sine"; o.frequency.value=freq;
    const t=ctx.currentTime+delay;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+0.01);
    g.gain.linearRampToValueAtTime(0,t+dur);
    o.start(t); o.stop(t+dur+0.05);
  } catch(e){}
}

function playSound(type){
  if(!document.getElementById("sound-toggle").checked) return;
  if(type==="work")  { beep(880,0.12,0.35,0); beep(1100,0.18,0.35,0.15); }
  if(type==="rest")  { beep(660,0.18,0.25,0); }
  if(type==="break") { beep(440,0.15,0.25,0); beep(440,0.15,0.25,0.2); beep(440,0.15,0.25,0.4); }
  if(type==="warn")  { beep(880,0.08,0.2,0); beep(880,0.08,0.2,0.15); beep(880,0.08,0.2,0.3); }
  if(type==="done")  { [0,0.18,0.36,0.56].forEach((d,i)=>beep([880,1100,1320,1760][i],0.2,0.3,d)); }
}

function fmt(s){ return Math.floor(s/60)+":"+(s%60<10?"0":"")+s%60; }

function tags2html(tags){
  return tags.map(t=>{
    const c=tagColors[t];
    return `<span class="tag" style="background:${c.bg};color:${c.color};border-color:${c.border};">${tagLabel[t]}</span>`;
  }).join("");
}

function updateUI(){
  const ex=exercises[exIdx];
  const isBreak=phase==="break";
  const color=phaseColors[phase]||phaseColors.idle;
  document.documentElement.style.setProperty("--phase-color", color);

  document.getElementById("ex-name").textContent = isBreak ? "Circuit break" : ex.name;
  document.getElementById("tags").innerHTML = isBreak
    ? `<span class="tag" style="background:rgba(90,180,245,0.12);color:#5ab4f5;border-color:rgba(90,180,245,0.3);">1 minute rest</span>`
    : tags2html(ex.tags);
  document.getElementById("tip").textContent = isBreak ? "Catch your breath. Shake out your legs. Hydrate." : ex.tip;
  document.getElementById("why").innerHTML = isBreak ? "" : `<b>why:</b> ${ex.why}`;

  const total = phase==="rest"?REST : phase==="break"?BREAK : WORK;
  document.getElementById("countdown").textContent = remaining;
  document.getElementById("countdown").style.color = color;
  document.getElementById("progress-fill").style.width = Math.round(remaining/total*100)+"%";
  document.getElementById("phase-sub").textContent = `${WORK}s work · ${REST}s rest`;

  const label = phase==="work"?"WORK":phase==="rest"?"REST":phase==="break"?"BREAK":"READY";
  const pill=document.getElementById("phase-pill");
  pill.textContent=label;
  pill.style.background=`${color}1e`;
  pill.style.color=color;
  pill.style.borderColor=`${color}4d`;

  document.getElementById("stat-circuit").textContent=(circuit+1)+"/"+CIRCUITS;
  document.getElementById("stat-ex").textContent=(exIdx+1)+"/"+N;
  document.getElementById("stat-time").textContent=fmt(totalElapsed);

  const dc=document.getElementById("circuit-dots");
  dc.innerHTML="";
  dc.style.display="flex"; dc.style.gap="6px";
  for(let i=0;i<CIRCUITS;i++){
    const d=document.createElement("div"); d.className="dot";
    if(i<circuit) d.classList.add("done"); else if(i===circuit) d.classList.add("active");
    dc.appendChild(d);
  }

  let next="";
  if(phase==="work") next=`next → ${REST}s rest`;
  else if(phase==="rest"){
    const ni=exIdx+1;
    if(ni<N) next="next → "+exercises[ni].name;
    else if(circuit+1<CIRCUITS) next="next → circuit break";
    else next="next → done!";
  }
  else if(phase==="break") next="next → "+exercises[0].name;
  else next="first → "+exercises[0].name;
  document.getElementById("next-label").textContent=next;
}

function advance(){
  if(phase==="work"){
    phase="rest"; remaining=REST; playSound("rest");
  } else if(phase==="rest"){
    exIdx++;
    if(exIdx>=N){
      exIdx=0; circuit++;
      if(circuit>=CIRCUITS){ endWorkout(); return; }
      phase="break"; remaining=BREAK; playSound("break");
    } else {
      phase="work"; remaining=WORK; playSound("work");
    }
  } else if(phase==="break"){
    phase="work"; remaining=WORK; playSound("work");
  }
  updateUI();
}

function tick(){
  remaining--; totalElapsed++;
  if(remaining===3) playSound("warn");
  if(remaining<=0) advance(); else updateUI();
}

function endWorkout(){
  clearInterval(timerInt); playSound("done");
  document.querySelector(".container").innerHTML=`
    <div class="done-screen">
      <div class="trophy">✦</div>
      <h2>Workout complete</h2>
      <p>${CIRCUITS} circuits &nbsp;·&nbsp; ${CIRCUITS*N} exercises &nbsp;·&nbsp; ${fmt(totalElapsed)} total</p>
      <button onclick="location.reload()" style="max-width:200px;">↺ &nbsp;Start over</button>
    </div>`;
}

function startPause(){
  const btn=document.getElementById("btn-start");
  if(!started){
    started=true; phase="work"; remaining=WORK;
    btn.innerHTML="⏸ &nbsp;Pause";
    playSound("work"); updateUI();
    timerInt=setInterval(tick,1000);
  } else if(timerInt){
    clearInterval(timerInt); timerInt=null;
    btn.innerHTML="▶ &nbsp;Resume";
  } else {
    timerInt=setInterval(tick,1000);
    btn.innerHTML="⏸ &nbsp;Pause";
  }
}

function resetAll(){
  clearInterval(timerInt); timerInt=null; started=false;
  circuit=0; exIdx=0; phase="idle"; remaining=WORK; totalElapsed=0;
  document.getElementById("btn-start").innerHTML="▶ &nbsp;Start";
  updateUI();
}

document.getElementById("sound-toggle").addEventListener("change",function(){
  document.getElementById("sound-label").textContent=this.checked?"sound on":"sound off";
});

document.getElementById("legend").innerHTML=`
  <div class="legend-item"><span class="legend-dot" style="background:${phaseColors.work};"></span>Work ${WORK}s</div>
  <div class="legend-item"><span class="legend-dot" style="background:${phaseColors.rest};"></span>Rest ${REST}s</div>
  <div class="legend-item"><span class="legend-dot" style="background:${phaseColors.break};"></span>Break ${BREAK}s</div>`;

document.getElementById("full-list").innerHTML=exercises.map((e,i)=>`
  <div class="list-item">
    <span class="list-num">${i+1}</span>
    <span style="flex:1;">${e.name}</span>
    <span style="display:flex;gap:4px;flex-wrap:wrap;">${tags2html(e.tags)}</span>
  </div>`).join("");

resetAll();
</script>
</body>
</html>
